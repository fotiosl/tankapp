<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TankApp - Spritpreise &amp; Tankstellen</title>

    <!-- Web App & iOS Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TankApp" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Theme & Icons -->
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tankapp_theme');
          var prefersLight =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: light)').matches;
          var isLight = saved === 'light' || (saved !== 'dark' && prefersLight);
          document.documentElement.classList.toggle('dark', !isLight);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', isLight ? '#f1f5f9' : '#0f172a');
          var metaStatus = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (metaStatus) metaStatus.setAttribute('content', isLight ? 'default' : 'black-translucent');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
